
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Cimel Email Verify</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 22px;
      display: grid; place-items: center;
      font-family: Arial, sans-serif; color: #f4f7ff;
      background: radial-gradient(ellipse at top, #172b46, #080b12 70%);
    }
    .card {
      width: 100%; max-width: 420px; padding: 28px;
      border-radius: 20px; background: #111722;
      border: 1px solid #2b3b52;
      box-shadow: 0 20px 60px #0006;
    }
    .logo {
      width: 52px; height: 52px; display: grid;
      place-items: center; border-radius: 15px;
      background: #173e62; color: #80c9ff;
      font-size: 25px; font-weight: bold;
    }
    h1 { font-size: 25px; margin: 20px 0 10px; }
    p { color: #a9b5c8; font-size: 14px; line-height: 1.7; }
    label { display: block; margin: 22px 0 9px; font-size: 13px; }
    input, button {
      width: 100%; min-height: 48px; border-radius: 10px;
      font-size: 15px;
    }
    input {
      padding: 0 13px; color: white; background: #0a101b;
      border: 1px solid #34435b; outline: none;
    }
    input:focus { border-color: #62b8ff; }
    button {
      margin-top: 12px; border: 0; cursor: pointer;
      background: #75bdff; color: #08111c; font-weight: bold;
    }
    button:disabled { opacity: .55; }
    #status {
      margin-top: 17px; padding: 12px; border-radius: 10px;
      background: #0a101b; overflow-wrap: anywhere;
      font-size: 13px; line-height: 1.6;
    }
    .hidden { display: none !important; }
    .foot { text-align: center; margin-top: 22px; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">C</div>
    <h1 id="heading">Verifikasi Email</h1>
    <p id="description">
      Masukkan email kamu. Kami akan mengirimkan tautan
      untuk memverifikasi email dan masuk ke akun.
    </p>

    <form id="emailForm">
      <label for="email">Alamat email</label>
      <input id="email" type="email" placeholder="nama@email.com"
        autocomplete="email" required maxlength="254">
      <button id="sendButton" type="submit">
        KIRIM TAUTAN VERIFIKASI
      </button>
    </form>

    <div id="status" role="status" aria-live="polite" class="hidden"></div>
    <button id="logoutButton" type="button" class="hidden">KELUAR</button>
    <p class="foot">CIMEL EMAIL VERIFY · SECURE SIGN-IN</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rwcnkmxqospdxynuponv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_nm3C00IWE5y7VYeLKkhRsw_L6sL2hId";

    const heading = document.getElementById("heading");
    const description = document.getElementById("description");
    const form = document.getElementById("emailForm");
    const emailInput = document.getElementById("email");
    const sendButton = document.getElementById("sendButton");
    const statusBox = document.getElementById("status");
    const logoutButton = document.getElementById("logoutButton");

    function showStatus(message) {
      statusBox.textContent = message;
      statusBox.classList.remove("hidden");
    }

    function showSignedIn(email) {
      heading.textContent = "Email berhasil diverifikasi!";
      description.textContent = "Kamu berhasil masuk ke website.";
      form.classList.add("hidden");
      logoutButton.classList.remove("hidden");
      showStatus("Sesi login aktif: " + (email || "akun kamu"));
    }

    if (!window.supabase) {
      showStatus("Gagal memuat layanan login. Periksa koneksi internet dan muat ulang halaman.");
    } else {
      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      client.auth.onAuthStateChange((event, session) => {
        if (session) showSignedIn(session.user.email);
      });

      client.auth.getSession().then(({ data, error }) => {
        if (error) showStatus("Tidak dapat memeriksa sesi. Muat ulang halaman.");
        else if (data.session) showSignedIn(data.session.user.email);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = emailInput.value.trim();
        if (!email) return;

        sendButton.disabled = true;
        sendButton.textContent = "MENGIRIM...";
        showStatus("Sedang memproses permintaan email...");

        try {
          const { error } = await client.auth.signInWithOtp({
            email,
            options: { emailRedirectTo: window.location.origin }
          });

          if (error) throw error;

          showStatus(
            "Permintaan berhasil diproses. Periksa inbox dan folder spam. Buka tautan email untuk masuk ke website."
          );
          sendButton.textContent = "KIRIM ULANG TAUTAN";
        } catch (error) {
          console.error(error);
          showStatus(
            "Email gagal dikirim. Periksa pengaturan Supabase, koneksi, dan batas pengiriman email."
          );
          sendButton.textContent = "COBA LAGI";
        } finally {
          sendButton.disabled = false;
        }
      });

      logoutButton.addEventListener("click", async () => {
        logoutButton.disabled = true;
        const { error } = await client.auth.signOut();

        if (error) {
          showStatus("Gagal keluar. Silakan coba lagi.");
        } else {
          heading.textContent = "Verifikasi Email";
          description.textContent = "Masukkan email untuk menerima tautan login.";
          form.classList.remove("hidden");
          logoutButton.classList.add("hidden");
          emailInput.value = "";
          showStatus("Kamu sudah keluar.");
        }

        logoutButton.disabled = false;
      });
    }
  </script>
</body>
  </html>
