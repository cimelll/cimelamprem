
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>CIMELAM PREM</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px;
 display:grid;place-items:center;
 font-family:Arial,sans-serif;color:#f4f7ff;
 background:radial-gradient(ellipse at top,#172b46,#080b12 70%);
}
.card{
 width:100%;max-width:430px;padding:26px;
 border-radius:20px;background:#111722;
 border:1px solid #2b3b52;
 box-shadow:0 20px 60px #0006;
}
.logo{
 width:52px;height:52px;display:grid;place-items:center;
 border-radius:15px;background:#173e62;color:#80c9ff;
 font-size:25px;font-weight:bold;
}
h1{font-size:25px;margin:20px 0 10px}
p{color:#a9b5c8;font-size:14px;line-height:1.7}
label{display:block;margin:20px 0 9px;font-size:13px}
input,button{
 width:100%;min-height:48px;border-radius:10px;
 font-size:14px;
}
input{
 padding:12px;color:white;background:#0a101b;
 border:1px solid #34435b;outline:none;
}
input:focus{border-color:#62b8ff}
button{
 margin-top:12px;border:0;cursor:pointer;
 background:#75bdff;color:#08111c;font-weight:bold;
}
button:disabled{opacity:.55;cursor:wait}
.secondary{
 background:#1b2b40;color:#d8eaff;
 border:1px solid #344b67;
}
.status{
 margin-top:16px;padding:12px;border-radius:10px;
 background:#0a101b;overflow-wrap:anywhere;
 font-size:13px;line-height:1.7;
}
.hidden{display:none!important}
.divider{border:0;border-top:1px solid #29384c;margin:24px 0}
.foot{text-align:center;margin-top:22px;font-size:11px}
</style>
</head>

<body>
<main class="card">
 <div class="logo">C</div>
 <h1 id="heading">CIMELAM PREM</h1>
 <p>
  masuk menggunakan email melalui layanan autentikasi
  supabase yang terhubung dengan website ini.
 </p>

 <form id="emailForm">
  <label for="email">alamat email</label>
  <input id="email" type="email" placeholder="nama@email.com"
   autocomplete="email" required maxlength="254">
  <button id="sendButton" type="submit">
   KIRIM MAGIC LINK
  </button>
 </form>

 <hr class="divider">

 <label for="magicLink">tempel link verifikasi supabase</label>
 <input id="magicLink" type="url"
  placeholder="https://...supabase.co/auth/v1/verify">

 <button id="verifyButton" class="secondary" type="button">
  PERIKSA LINK
 </button>

 <div id="status" class="status hidden"
  role="status" aria-live="polite"></div>

 <div id="account" class="hidden">
  <hr class="divider">
  <p id="accountEmail"></p>
  <button id="logoutButton" class="secondary" type="button">
   KELUAR
  </button>
 </div>

 <p class="foot">CIMELAM PREM · SECURE SIGN-IN</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
 "https://rwcnkmxqospdxynuponv.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_nm3C00IWE5y7VYeLKkhRsw_L6sL2hId";

const $ = id => document.getElementById(id);
const form = $("emailForm");
const email = $("email");
const sendButton = $("sendButton");
const verifyButton = $("verifyButton");
const magicLink = $("magicLink");
const statusBox = $("status");

function status(message){
 statusBox.textContent = message;
 statusBox.classList.remove("hidden");
}

function showAccount(user){
 $("heading").textContent = "login berhasil";
 $("accountEmail").textContent =
  "akun yang masuk: " + (user.email || "akun supabase");
 $("account").classList.remove("hidden");
 form.classList.add("hidden");
}

function showLogin(){
 $("heading").textContent = "CIMELAM PREM";
 $("account").classList.add("hidden");
 form.classList.remove("hidden");
}

if(!window.supabase){
 status("layanan gagal dimuat. periksa koneksi internet.");
}else{
 const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
   auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true
   }
  }
 );

 async function checkSession(){
  const {data,error} = await client.auth.getSession();

  if(error){
   status("gagal memeriksa sesi. coba muat ulang halaman.");
   return;
  }

  if(data.session){
   showAccount(data.session.user);
  }
 }

 client.auth.onAuthStateChange((event,session)=>{
  if(session){
   showAccount(session.user);
   status("login supabase berhasil.");
  }
 });

 checkSession();

 form.addEventListener("submit",async event=>{
  event.preventDefault();

  const address = email.value.trim();
  if(!address)return;

  sendButton.disabled = true;
  sendButton.textContent = "MENGIRIM...";

  try{
   const {error} = await client.auth.signInWithOtp({
    email:address,
    options:{
     emailRedirectTo:window.location.origin
    }
   });

   if(error)throw error;

   status(
    "permintaan berhasil dikirim. periksa inbox atau spam, " +
    "lalu buka magic link supabase untuk masuk."
   );
   sendButton.textContent = "KIRIM ULANG LINK";
  }catch(error){
   console.error(error);
   status(
    "email gagal dikirim. periksa konfigurasi supabase, " +
    "url redirect, dan pengaturan email."
   );
   sendButton.textContent = "COBA LAGI";
  }finally{
   sendButton.disabled = false;
  }
 });

 verifyButton.addEventListener("click",async()=>{
  const raw = magicLink.value.trim();

  if(!raw){
   status("tempel link terlebih dahulu.");
   return;
  }

  let url;

  try{
   url = new URL(raw);
  }catch{
   status("format link tidak valid.");
   return;
  }

  if(url.protocol !== "https:"){
   status("link harus menggunakan https.");
   return;
  }

  const allowedHosts = [
   "rwcnkmxqospdxynuponv.supabase.co",
   window.location.hostname
  ];

  if(!allowedHosts.includes(url.hostname)){
   status(
    "domain link tidak cocok. gunakan link autentikasi " +
    "supabase milik project ini."
   );
   return;
  }

  if(url.hostname === window.location.hostname){
   status(
    "link website diterima. jika link sudah dibuka, " +
    "status login akan diperiksa otomatis."
   );
   await checkSession();
   return;
  }

  if(!url.pathname.endsWith("/auth/v1/verify")){
   status("link bukan endpoint verifikasi supabase yang dikenali.");
   return;
  }

  status(
   "domain link cocok. untuk menyelesaikan verifikasi, " +
   "buka link dari email secara langsung. setelah kembali " +
   "ke website, status login akan diperiksa otomatis."
  );
 });

 $("logoutButton").addEventListener("click",async()=>{
  $("logoutButton").disabled = true;

  const {error} = await client.auth.signOut();

  $("logoutButton").disabled = false;

  if(error){
   status("gagal keluar. coba lagi.");
   return;
  }

  showLogin();
  status("kamu sudah keluar dari akun supabase.");
 });
}
</script>
</body>
</html>
